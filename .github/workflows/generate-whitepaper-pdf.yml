name: Generate whitepaper PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/whitepaper/content/**'
      - 'scripts/generate_whitepaper_pdf.py'
      - '.github/workflows/generate-whitepaper-pdf.yml'

permissions:
  contents: write

concurrency:
  group: generate-whitepaper-pdf
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab==4.2.2

      - name: Generate official PDF
        run: python scripts/generate_whitepaper_pdf.py

      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AgentOS_Whitepaper_v1.0_July_2026.pdf
          if git diff --cached --quiet; then
            echo 'Whitepaper PDF is already current.'
            exit 0
          fi
          git commit -m 'docs: generate AgentOS whitepaper PDF'
          git pull --rebase origin main
          git push origin HEAD:main
